<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8" />
<title>NeVie Logo Options</title>
<style>
  html,body{margin:0;background:#0B1020;font-family:'Segoe UI',system-ui,sans-serif;}
  .row{display:flex;flex-direction:column;gap:26px;padding:28px;}
  .card{background:#111A33;border:1px solid #233056;border-radius:26px;padding:26px;display:flex;align-items:center;justify-content:center;min-height:300px;}
  .label{color:#8FA3D0;font-size:13px;letter-spacing:2px;text-transform:uppercase;margin-top:14px;text-align:center;}
  svg{display:block;}
</style>
</head>
<body>
<div class="row">

  <!-- ============ VARIAN A : maskot ekspresif + wordmark (untuk HEADER) ============ -->
  <div>
    <div class="card">
      <svg width="900" height="320" viewBox="0 0 900 320" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="screenA" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#9FEBFF"/><stop offset="1" stop-color="#1B6FE0"/>
          </linearGradient>
          <linearGradient id="wordA" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#FF7A18"/><stop offset="1" stop-color="#FF4D2D"/>
          </linearGradient>
          <linearGradient id="bodyA" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#22315A"/><stop offset="1" stop-color="#141F3D"/>
          </linearGradient>
        </defs>

        <!-- garis gerak cartoony -->
        <path d="M30 96 h34" stroke="#7FE3FF" stroke-width="7" stroke-linecap="round" opacity=".7"/>
        <path d="M22 140 h40" stroke="#7FE3FF" stroke-width="7" stroke-linecap="round" opacity=".5"/>
        <path d="M32 184 h32" stroke="#7FE3FF" stroke-width="7" stroke-linecap="round" opacity=".7"/>

        <!-- antena bintang -->
        <line x1="168" y1="56" x2="118" y2="10" stroke="#FF7A18" stroke-width="8" stroke-linecap="round"/>
        <line x1="168" y1="56" x2="218" y2="10" stroke="#FF7A18" stroke-width="8" stroke-linecap="round"/>
        <path d="M118 0 l4.5 9 9.5 1.5 -7 6.8 1.8 9.4 -8.8 -4.7 -8.8 4.7 1.8 -9.4 -7 -6.8 9.5 -1.5 z" fill="#FFD166"/>
        <path d="M218 0 l4.5 9 9.5 1.5 -7 6.8 1.8 9.4 -8.8 -4.7 -8.8 4.7 1.8 -9.4 -7 -6.8 9.5 -1.5 z" fill="#FFD166"/>

        <!-- badan TV -->
        <rect x="58" y="52" width="220" height="168" rx="38" fill="url(#bodyA)" stroke="#FF7A18" stroke-width="7"/>
        <!-- tangan melambai -->
        <path d="M60 150 q-22 -6 -26 -30" stroke="#FF7A18" stroke-width="9" stroke-linecap="round" fill="none"/>
        <circle cx="32" cy="116" r="11" fill="#FFD166"/>
        <!-- kaki -->
        <rect x="92" y="218" width="20" height="28" rx="10" fill="#FF7A18"/>
        <rect x="224" y="218" width="20" height="28" rx="10" fill="#FF7A18"/>

        <!-- layar -->
        <rect x="80" y="74" width="176" height="122" rx="26" fill="url(#screenA)"/>

        <!-- mata besar cartoony -->
        <ellipse cx="126" cy="122" rx="21" ry="27" fill="#FFFFFF"/>
        <ellipse cx="192" cy="122" rx="21" ry="27" fill="#FFFFFF"/>
        <circle cx="132" cy="130" r="10" fill="#0B1020"/>
        <circle cx="198" cy="130" r="10" fill="#0B1020"/>
        <circle cx="136" cy="125" r="4" fill="#FFFFFF"/>
        <circle cx="202" cy="125" r="4" fill="#FFFFFF"/>
        <!-- alis -->
        <path d="M104 92 q20 -14 40 -4" stroke="#0B1020" stroke-width="7" stroke-linecap="round" fill="none"/>
        <path d="M170 88 q20 -10 40 4" stroke="#0B1020" stroke-width="7" stroke-linecap="round" fill="none"/>
        <!-- mulut terbuka + lidah -->
        <path d="M112 158 q44 42 88 0 q-44 12 -88 0 z" fill="#0B1020"/>
        <path d="M128 170 q28 16 56 0 q-28 6 -56 0 z" fill="#FF6B8A"/>
        <!-- blush -->
        <ellipse cx="102" cy="162" rx="13" ry="8" fill="#FF8FA3" opacity=".85"/>
        <ellipse cx="216" cy="162" rx="13" ry="8" fill="#FF8FA3" opacity=".85"/>

        <!-- wordmark -->
        <text x="320" y="190" font-family="'Segoe UI',system-ui,sans-serif" font-size="104" font-weight="900" letter-spacing="-3">
          <tspan fill="#FFFFFF">Ne</tspan><tspan fill="url(#wordA)">Vie</tspan>
        </text>
        <text x="324" y="240" font-family="'Segoe UI',system-ui,sans-serif" font-size="30" font-weight="600" letter-spacing="10" fill="#8FA3D0">NEXT MOVIE</text>
      </svg>
    </div>
    <div class="label">A - Header (TonTon ekspresif, cartoony)</div>
  </div>

  <!-- ============ VARIAN B : ikon aplikasi, TonTon FACELESS ============ -->
  <div>
    <div class="card">
      <svg width="360" height="360" viewBox="0 0 360 360" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="bgB" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#1B2A4A"/><stop offset="1" stop-color="#0B1020"/>
          </linearGradient>
          <linearGradient id="screenB" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#7FE3FF"/><stop offset="1" stop-color="#1B6FE0"/>
          </linearGradient>
          <linearGradient id="wordB" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#FF7A18"/><stop offset="1" stop-color="#FF4D2D"/>
          </linearGradient>
        </defs>
        <rect x="8" y="8" width="344" height="344" rx="92" fill="url(#bgB)" stroke="url(#wordB)" stroke-width="10"/>

        <line x1="180" y1="72" x2="132" y2="30" stroke="#FF7A18" stroke-width="9" stroke-linecap="round"/>
        <line x1="180" y1="72" x2="228" y2="30" stroke="#FF7A18" stroke-width="9" stroke-linecap="round"/>
        <circle cx="132" cy="30" r="12" fill="#FF4D2D"/>
        <circle cx="228" cy="30" r="12" fill="#FF4D2D"/>

        <rect x="76" y="70" width="208" height="150" rx="42" fill="#141F3D" stroke="#FF7A18" stroke-width="7"/>
        <!-- layar faceless: polos + highlight diagonal -->
        <rect x="100" y="92" width="160" height="106" rx="30" fill="url(#screenB)"/>
        <path d="M100 122 L196 92 L152 198 L100 198 Z" fill="#FFFFFF" opacity=".22"/>
        <circle cx="222" cy="118" r="12" fill="#FFFFFF" opacity=".5"/>

        <rect x="112" y="220" width="20" height="22" rx="10" fill="#FF7A18"/>
        <rect x="228" y="220" width="20" height="22" rx="10" fill="#FF7A18"/>

        <text x="180" y="300" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="62" font-weight="900" letter-spacing="-1">
          <tspan fill="#FFFFFF">Ne</tspan><tspan fill="url(#wordB)">Vie</tspan>
        </text>
      </svg>
    </div>
    <div class="label">B - Ikon aplikasi (TonTon faceless)</div>
  </div>

  <!-- ============ VARIAN C : wordmark minimal (untuk SPLASH) ============ -->
  <div>
    <div class="card">
      <svg width="900" height="300" viewBox="0 0 900 300" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="wordC" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#7FE3FF"/>
          </linearGradient>
          <linearGradient id="wordC2" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#FF7A18"/><stop offset="1" stop-color="#FF4D2D"/>
          </linearGradient>
        </defs>
        <text x="90" y="190" font-family="'Segoe UI',system-ui,sans-serif" font-size="150" font-weight="900" letter-spacing="-6">
          <tspan fill="url(#wordC)">Ne</tspan><tspan fill="url(#wordC2)">Vie</tspan>
        </text>
        <rect x="96" y="222" width="430" height="7" rx="3.5" fill="url(#wordC2)"/>
        <text x="96" y="274" font-family="'Segoe UI',system-ui,sans-serif" font-size="34" font-weight="600" letter-spacing="14" fill="#8FA3D0">NEXT MOVIE</text>
      </svg>
    </div>
    <div class="label">C - Wordmark minimal (splash screen)</div>
  </div>

</div>
</body>
</html>
